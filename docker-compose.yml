version: "3.9"

services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python main.py"
    volumes:
      - ./:/app
    env_file:
      - .env
    ports:
      - "8000:8000"

  agent:
    image: python:3.12-slim
    working_dir: /app/agent
    command: sh -c "pip install --no-cache-dir websockets python-dotenv && python main.py"
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - backend
